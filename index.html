lied"], "applied": "◆ 钩子改写(2个方案)\n方案1:1:1借分屏格式:\"The shot / How I filmed it\"——下半屏全部换成O3 Hue的支/吸/挂机位(桌面圆环立、吸金属面、挂衣柜门)\n方案2:\"no tripod in my bag. it's ON my phone\"(中译:包里没有三脚架,它就在我手机上)\n◆ 填好的脚本(14s)\n0-4s 场景①:咖啡店俯拍大片 / 壳的圆环立桌上斜角拍\n4-8s 场景②:健身房全身镜大片 / 手机吸在金属柱上\n8-11s 场景③:衣柜前GRWM / 壳挂在衣柜把手上拍\n11-14s 场景④:镜面自拍收尾,撞色壳正面出镜\n文案区:me n my O3 Hue against the world 🤳 link in bio(套用原句式+导流)\n◆ 带卖点的字幕变体\n· the shot / the case that took it(中译:成片 / 拍下它的壳)\n· my phone case is my camera crew(中译:我的手机壳是我的摄影团队)", "cover_url": "assets/covers/DY7Pn4iNjqQ.jpg", "video_url": "assets/videos/DY7Pn4iNjqQ_preview.mp4"}, {"id": "DbpMgN5J-Pk", "url": "https://www.instagram.com/reel/DbpMgN5J-Pk/", "added": "2026-08-22", "author": "@michelle.cheng (michelle .☘︎ ݁˖)", "duration": 7.1, "category": "热点趋势", "tags": ["多巴胺穿搭", "夏日配色", "生活态度钩子", "同色系配饰", "OOTD", "快节奏展示"], "screen_text": "0-7.1s 顶部粉色颜文字 + 青绿色字幕:life is short add more colour!!(中译:人生苦短,多加点颜色!!)", "caption": "wear more colour this summer diva 💗🛼🫧 #summeroutfit #aquapink #tealflats #niihai #colourfuloutfit", "variants": ["life is short match your case to your mood(中译:人生苦短,让手机壳跟心情同色)", "boring outfit? add colour at the edges(中译:穿搭太无聊?在边边角角加点颜色)", "make your phone part of the fit(中译:让手机也成为穿搭的一部分)", "summer said: more colour please(中译:夏天说:颜色再多一点)", "one bright accessory changes everything(中译:一个亮色配饰就能改变全部氛围)"], "hook_type": "生活态度宣言型 + 多巴胺穿搭展示", "hook_visual": "近景正脸开场,人物穿水绿色上衣,同色发夹、手环、鞋和小包一起入镜,随后退到全身展示完整配色", "hook_line": "life is short add more colour!!(中译:人生苦短,多加点颜色!!)", "hook_why": "一句价值观式字幕把普通穿搭展示变成态度表达,颜色高度统一又很抓眼,前1秒就能让人知道该看什么", "structure": "0-1s 钩子:近景正脸+字幕出现,水绿色衣服和发夹先建立色彩记忆\n1-3s 展示:后退到全身,露出上衣、粉色短裙、同色鞋和小包\n3-5s 节奏:转身/甩发/摆手,展示背面和侧面轮廓\n5-6.2s 细节:侧身靠近镜头,突出包、手环、发夹这些小面积亮色\n6.2-7.1s 收尾:回到近景挥手/眨眼,保持字幕不变,用表情完成记忆点\n(文案区:wear more colour this summer diva + 夏日穿搭标签)", "shooting": "① 固定机位竖屏拍卧室全身,不用复杂转场,靠走位和姿态变化撑满7秒\n② 字幕全程固定在上方,颜色和穿搭主色呼应,视觉很统一\n③ 单一亮色反复出现:衣服、发夹、手环、鞋、包形成可截图的配色公式\n④ 近景开场+近景收尾让人物亲密感更强,中段全身用于种草穿搭\n⑤ 节奏每1-2秒换一次姿势,但背景不变,拍摄成本低,复制门槛低", "template": "1️⃣ 选一个主色,让衣服/手机壳/指甲/包/鞋至少3处同色呼应\n2️⃣ 开头近景给一句生活态度字幕,字色跟主色一致\n3️⃣ 退到全身展示完整搭配,中段做2-3个转身、摆手、侧身动作\n4️⃣ 结尾再靠近镜头,用挥手/眨眼/拿起产品做收尾\n📌 字幕不要解释产品,只写态度句;产品自然出现在配色里\n📌 适合夏日、多巴胺、换季穿搭、手机壳配饰化内容", "transcript": "", "bgm": {"title": "原声(未识别)", "artist": "", "file": "audio/DbpMgN5J-Pk.mp3", "url": "assets/audio/DbpMgN5J-Pk.mp3"}, "video_file": "videos/DbpMgN5J-Pk.mp4", "cover": "frames/DbpMgN5J-Pk/cover.jpg", "extracted": ["screen_text", "caption", "variants", "hook", "structure", "shooting", "template", "bgm", "applied"], "applied": "◆ 钩子改写(3个方案)\n方案1:life is short add more colour to your phone!!(中译:人生苦短,也给手机加点颜色!!)\n方案2:your phone case should match the fit(中译:手机壳也该跟穿搭同色)\n方案3:one cute case, three ways to hold your phone(中译:一个可爱手机壳,三种手机位)\n◆ 填好的脚本(7s)\n0-1s 近景钩子:手拿 Ostand O3 Hue 手机壳靠近镜头,字幕 life is short add more colour to your phone!!\n1-3s 全身展示:手机壳颜色与上衣/美甲/包同色呼应,把手机当配饰拿在手里\n3-5s 功能细节:圆环支架立在化妆台,手机自己拍 OOTD;快速切到吸在金属衣架/柜门上\n5-7s 收尾:回到近景,转一下圆环支架,壳和穿搭同框挥手\n◆ 带卖点的字幕变体\n· life is short, match your case to your outfit(中译:人生苦短,手机壳也要配穿搭)\n· cute case, built-in tripod energy(中译:可爱手机壳,自带三脚架感)\n· add colour, then let the ring hold the angle(中译:先加颜色,再让圆环撑住机位)\n◆ 拍摄注意\n用 O3 Hue 的撞色做主视觉,不要一上来硬讲防摔;前5秒先卖颜值和穿搭感,最后用支架/磁吸/挂拍露出功能。", "cover_url": "assets/covers/DbpMgN5J-Pk.jpg", "video_url": "assets/videos/DbpMgN5J-Pk_preview.mp4"}, {"id": "DZvCuLVJM97", "url": "https://www.instagram.com/reel/DZvCuLVJM97/", "added": "2026-08-22", "author": "@champagneunicorns (✨ C H A M P A G N E ✨)", "duration": 9.0, "category": "热点趋势", "tags": ["宠物穿搭", "同色系配饰", "鞋包搭配", "多巴胺配色", "OOTD", "趣味反差"], "screen_text": "无画面字幕/花字。\n(钩子主要来自画面反差和文案区反问:what? you don’t match your shoes to your cats outfit? just me?)", "caption": "what? you don’t match your shoes to your cats outfit? just me? Oh….👀🫶✨🏳️‍🌈😘\n\n#shoes #cat #cats #ootd #pride", "variants": ["what? you don't match your phone case to your outfit? just me?(中译:什么?你不会让手机壳和穿搭配色吗?只有我这样?)", "your case doesn't match your shoes? oh...(中译:你的手机壳不配鞋子?哦...)", "matching my outfit to every little accessory(中译:把穿搭配到每一个小配饰)", "if my cat has a color story, so do I(中译:如果我的猫都有配色主题,我也要有)", "my phone case is part of the outfit now(中译:手机壳现在也是穿搭的一部分)"], "hook_type": "视觉反差型 + 同色系穿搭梗", "hook_visual": "低机位固定构图,猫戴红色爱心墨镜和红色围巾坐在彩虹镜/淡紫柜前,主人穿红裙、红白格袜和红色高跟鞋从右侧走入,和猫的配饰完全同色呼应", "hook_line": "what? you don’t match your shoes to your cats outfit? just me?(中译:什么?你不会把鞋子和猫的穿搭配起来吗?只有我这样?)", "hook_why": "“给猫也做OOTD配色”本身很反常,再用鞋袜、裙子、小包和猫配饰强同步,观众第一秒就能看懂梗并想等下一套颜色", "structure": "0-3s 钩子:红色主题,猫戴红色爱心眼镜+红围巾,红色小包摆在旁边;主人红裙、红白格袜、红色高跟鞋入镜\n3-6s 换装:切到橙色主题,猫披橙色小披肩+橙色小包,主人彩色花裙、橙色袜、粉橙厚底鞋走过\n6-8s 延展:绿色主题,猫系绿色/蓝色丝巾+绿色小包,主人绿色鞋袜和花裙同色呼应\n8-9s 收尾:紫色/粉色主题,猫戴紫色格纹围巾+亮粉小包,主人从右侧闪过完成最后一组配色\n(文案区用反问把“鞋子要和猫穿搭搭配”这个怪趣行为说出来,补足无字幕信息)", "shooting": "① 低机位固定拍脚和猫,人物不露脸,把注意力集中在鞋、袜、裙摆、猫配饰和小包这些“配色证据”上\n② 同一背景重复切换配色,观众无需重新理解场景,只看颜色变化即可获得爽感\n③ 彩虹镜、淡紫柜、猫贴纸、花瓶和地毯构成高饱和室内布景,很适合多巴胺/骄傲月氛围\n④ 每套搭配都让猫占左侧稳定位置,主人从右侧走入制造节奏,形成可复制的“宠物静态+人动态”结构\n⑤ 没有画面字幕,靠文案反问解释梗;适合视觉本身足够强、静音也能看懂的穿搭类内容\n⑥ 宠物表情和夸张高跟鞋形成反差,降低炫搭配的距离感,更像轻松玩梗", "template": "1️⃣ 先选一个固定布景,让宠物/产品/配饰放在画面左侧或中心,机位保持不动\n2️⃣ 每一段只换一个主题色,让鞋、袜、包、围巾/手机壳至少3处同色呼应\n3️⃣ 人从画面边缘走入,只露腿部或手部,用“出现-停顿-走开”完成节奏\n4️⃣ 连拍3-4套颜色,每套2-3秒,用硬切制造换装爽感\n📌 画面可以不加字幕,但文案区必须用反问句点破荒诞设定\n📌 最适合宠物穿搭、鞋包搭配、手机壳配饰化、多巴胺颜色系列", "transcript": "", "bgm": {"title": "原声(未识别)", "artist": "", "file": "audio/DZvCuLVJM97.mp3", "url": "assets/audio/DZvCuLVJM97.mp3"}, "video_file": "videos/DZvCuLVJM97.mp4", "cover": "frames/DZvCuLVJM97/cover.jpg", "extracted": ["screen_text", "caption", "variants", "hook", "structure", "shooting", "template", "bgm", "applied"], "applied": "◆ 钩子改写(3个方案)\n方案1:what? you don't match your phone case to your shoes? just me?(中译:什么?你不会让手机壳和鞋子同色吗?只有我这样?)\n方案2:your phone case is part of the outfit now(中译:手机壳现在也是穿搭的一部分)\n方案3:matching my case to every little accessory(中译:让手机壳配上每一个小配饰)\n◆ 填好的脚本(9s)\n0-3s 红色主题:O3 Hue 撞色壳拿在手里/放在红色小包旁,红鞋红袜入镜,字幕 what? you don't match your case to your shoes? just me?\n3-6s 橙色或粉橙主题:换一套同色穿搭,手机用圆环支架立在地面或柜前,自己拍 OOTD,镜头只拍鞋、袜、裙摆和壳\n6-8s 绿色/蓝色主题:手机壳吸在金属柜/冰箱门上当临时机位,人从旁边走过,壳和包/美甲同色呼应\n8-9s 收尾:3个颜色的手机壳或3套穿搭快闪同框,手指转一下圆环支架,露出 O3 Hue 结构\n文案区:what? you don't match your phone case to your outfit? just me? O3 Hue stands, sticks & hangs so it can be in every fit pic. link in bio(中译:什么?你不会让手机壳和穿搭配色吗?O3 Hue 能立、能吸、能挂,每张穿搭照都能入镜;链接在主页)\n◆ 带卖点的字幕变体\n· your case should match the fit(中译:手机壳也该配穿搭)\n· shoes, bag, nails, case. obviously.(中译:鞋、包、美甲、手机壳,当然要配齐)\n· outfit check, but the case understood the assignment(中译:穿搭检查,手机壳也完全懂任务)\n◆ 拍摄注意\n这条最适合主推 O3 Hue 的“高颜值撞色/配饰化”卖点,功能只轻露:让圆环支架在收尾转一下,或让手机自己立/吸完成机位;不要把节奏拍成硬核功能讲解。", "cover_url": "assets/covers/DZvCuLVJM97.jpg", "video_url": "assets/videos/DZvCuLVJM97_preview.mp4"}, {"id": "Db58j7fA5X6", "url": "https://www.instagram.com/reel/Db58j7fA5X6/", "added": "2026-08-22", "author": "@boujee.syria (Syria Theus)", "duration": 8.43, "category": "ASMR", "tags": ["配饰叠戴", "手镯叮当声", "maximalist-jewelry", "OOTD", "声音钩子", "穿搭态度"], "screen_text": "0-8.4s  You will definitely HEAR me before you see me(中译:你肯定会先听到我,然后才看到我)\n(全片固定同一句字幕,HEAR 大写强化声音记忆点)", "caption": "Probably can hear me from a mile away 😩\n\nCred: @axaila \n\n#relatable #bangles #maximalist #jewelry #paulfrank \n\nexplore page, explore, high fashion, fashion, outfit inspo, womens fashion, ootd, outfit ideas, summer, summer outfit, summer fashion, grwm, outfit of the day, boujeesyria, reels, reels instagram, reel video", "variants": ["You will definitely hear my bracelets before you see me(中译:你肯定会先听到我的手镯,然后才看到我)", "If my outfit is quiet, my accessories are not(中译:就算穿搭很安静,我的配饰也不会安静)", "I do not enter quietly(中译:我出场从来不是悄悄的)", "Walking in like a human charm bracelet(中译:走路像一串会移动的幸运手链)", "Maximalist girls are never silent(中译:极繁女孩从来不会安静出场)"], "hook": "模特从远处正面走向镜头,一手扶帽子/头发,身上叠戴的大量手镯、戒指、包挂件和腰链不断晃动;画面固定字幕 \"You will definitely HEAR me before you see me\"(你肯定会先听到我,然后才看到我)。钩子把听觉预期先抛出来,再用近景配饰细节证明“真的会响”,很适合配饰、穿搭和个性人设内容。", "hook_type": "声音预告型 + 极繁配饰人设", "hook_visual": "暖色夕阳下,模特穿条纹 Paul Frank T 恤、短裤和麂皮长靴,背着挂满饰品的包从空旷水泥场地走向镜头,手腕和包挂件是最明显的动态焦点。", "hook_line": "You will definitely HEAR me before you see me(中译:你肯定会先听到我,然后才看到我)", "hook_why": "先用“声音比人先到”的夸张句制造好奇,再让手镯/挂件的近景和走动节奏兑现预期,既有记忆点也强化了 maximalist 风格身份。", "structure": "0-2s 钩子:正面全身走向镜头,手扶帽子/头发,字幕固定“先听到我再看到我”\n2-3.5s 细节证明:切到腰部和手腕近景,大量手镯、戒指、腰链、包挂件占满画面,让观众联想到叮当声\n3.5-5.8s 造型展示:回到半身/全身,模特整理墨镜和配饰,条纹上衣、短裤、长靴、红黄配饰形成强辨识度\n5.8-8.4s 收尾:侧身停顿后转身走远,背面帽子、靴子和包继续出镜,用“离场也有声音”的感觉完成闭环", "shooting": "① 固定机位拍全身走位,人物从中远景走到中景,低成本但有 runway 感\n② 全身镜头和配饰近景交替,先建立人设,再放大声音来源\n③ 暖色硬光/侧逆光让皮肤、金属饰品和红黄配色更亮,背景选简单水泥地+涂鸦墙避免抢戏\n④ 字幕只用一句,白色小字放在画面中下部,HEAR 全大写,静音观看也能理解梗\n⑤ 造型上用“多件小物同时动”制造声音想象:手镯、戒指、腰链、包挂件、钥匙扣都能成为 ASMR 记忆点\n⑥ 剪辑节奏短促,8 秒内完成“走近-细节-展示-走远”,适合完播和二刷", "template": "可复刻脚本(适合配饰/穿搭/手机壳等“存在感单品”):\n1️⃣ 0-2s:人物从远处走向镜头,字幕写“你会先听到/看到我的X,然后才看到我”\n2️⃣ 2-4s:切 2 个特写,只拍 X 在移动中的细节,让观众知道存在感来自哪里\n3️⃣ 4-6s:回到半身/全身,展示 X 如何和整体造型搭配\n4️⃣ 6-8s:转身离开或定格 pose,让 X 留在画面中心作为记忆点\n📌 字幕:全片固定一句,把关键词大写,例如 HEAR / SEE / CLICK / COLOR\n📌 声音:保留真实配饰声、扣环声、吸附声或脚步声,不要用太满的音乐盖掉细节\n📌 文案:用 relatable 语气写“Probably can hear/see me from a mile away”,再加产品/风格标签", "transcript": "", "bgm": {"title": "原声(未识别)", "artist": "", "file": "audio/Db58j7fA5X6.mp3", "url": "assets/audio/Db58j7fA5X6.mp3"}, "video_file": "videos/Db58j7fA5X6.mp4", "cover": "frames/Db58j7fA5X6/cover.jpg", "extracted": ["screen_text", "caption", "variants", "hook_type", "hook_visual", "hook_line", "hook_why", "structure", "shooting", "template", "transcript", "bgm", "category", "tags", "applied"], "applied": "◆ Ostand O3 Hue 套用方向\n这条适合套用:原片的核心不是讲功能,而是把“配饰存在感”拍成一句态度梗。O3 Hue 可以从“会响的手镯”改成“会被先看到的撞色手机壳/会自己立住的手机壳”,主打颜值配饰属性和支架实用性。\n\n◆ 钩子改写(2个方案)\n方案1:模特从远处走向镜头,手里拿着撞色 O3 Hue 手机壳,手机壳颜色先在画面里跳出来。字幕 \"You will definitely SEE my case before you see me\"(中译:你肯定会先看到我的手机壳,然后才看到我)。\n方案2:特写手指“咔哒”翻开圆环支架,手机自己立在咖啡桌/化妆台上开始拍 OOTD。字幕 \"You will definitely hear the click before you see the fit\"(中译:你会先听到那声咔哒,然后才看到整套穿搭)。\n\n◆ 填好的脚本(8s)\n0-2s 钩子:全身走向镜头,手机壳撞色面朝外,字幕固定 \"You will definitely SEE my case before you see me\"\n2-4s 特写:手机壳和美甲/包包/上衣同色系呼应,手指翻出 360° 圆环支架\n4-6s 功能证明:手机立在咖啡桌或化妆台上自动拍 GRWM/OOTD,人进入画面摆 pose\n6-8s 收尾:镜面自拍或走远背影,手机壳仍然是画面色彩焦点;最后补一句小字 \"stands, sticks & hangs\"(中译:能支、能吸、能挂)\n\n◆ 带卖点的字幕变体\n· You will definitely SEE my phone case before you see me(中译:你肯定会先看到我的手机壳,然后才看到我)\n· My phone case is part of the outfit now(中译:我的手机壳现在也是穿搭的一部分)\n· The case stands, the outfit speaks(中译:手机壳自己站住,穿搭自己说话)\n· It matches the fit and holds the shot(中译:它能搭配穿搭,也能撑住镜头)\n\n◆ 拍摄注意\n① 选一套和 O3 Hue 撞色壳能呼应的衣服/美甲/包包,让“壳=配饰”先成立\n② 保留圆环支架打开的真实咔哒声或桌面放置声,呼应原片的声音钩子\n③ 不要硬讲防摔参数,只在评论区或 caption 补一句 \"cute outside, military-grade protection inside\"(中译:外表好看,里面也有军工级防护)", "cover_url": "assets/covers/Db58j7fA5X6.jpg", "video_url": "assets/videos/Db58j7fA5X6_preview.mp4"}, {"id": "DWbv77yiI35", "url": "https://www.instagram.com/reel/DWbv77yiI35/", "added": "2026-08-22", "author": "@laraadkins (Lara Adkins)", "duration": 10.8, "category": "产品种草", "tags": ["彩色裤袜", "穿搭前后对比", "配饰点睛", "固定机位换装", "多巴胺穿搭", "时尚种草"], "screen_text": "0-2s my outfits cute but it's missing something...(我的穿搭很可爱,但总觉得少了点什么...)\n3-4s * tights *(裤袜)\n8s * tights *(裤袜)\n10s * tights *(裤袜)\n(核心字幕先制造缺口,再用单一答案*tights*反复点题)", "caption": "just a little 🩵pop🐬 you know *ੈ✩‧₊˚ \n\n#fashion #funky #outfitideas #colourfultights #styling", "variants": ["my outfit's cute but it's missing one thing...(中译:我的穿搭很可爱,但还差一样东西...)", "when the fit needs a little color pop(中译:当这套穿搭需要一点跳色)", "plain outfit? add one loud detail(中译:基础穿搭?加一个抢眼细节)", "the outfit wasn't finished until the tights showed up(中译:裤袜出现之前,这套穿搭都还没完成)", "one accessory changed the whole outfit(中译:一个配饰改变整套穿搭)"], "hook": "固定机位的衣帽间全身镜头,创作者穿灰黑基础造型站在画面中央,字幕写着“my outfits cute but it's missing something...”(我的穿搭很可爱,但总觉得少了点什么...)。先抛出一个人人都懂的穿搭缺口,让观众自然等答案;3秒后直接揭示答案是亮色 tights,用反差色完成记忆点。", "hook_type": "缺口悬念型 + 配饰点睛种草", "hook_visual": "衣帽间固定全身机位,衣架和彩色鞋架围绕人物,主角穿灰黑波点上衣和黑裙站在中间,双手叉腰等观众看出“少了什么”", "hook_line": "my outfits cute but it's missing something...(中译:我的穿搭很可爱,但总觉得少了点什么...)", "hook_why": "这句话把观众拉进“帮她找问题”的参与感里,答案又简单到一眼能懂:亮色裤袜让普通穿搭瞬间有风格,适合收藏和模仿。", "structure": "0-2s 钩子:灰黑基础造型全身站定,固定字幕提出“outfit missing something”的穿搭缺口\n3-4s 答案揭示:同一套黑裙直接加上亮粉色 tights 和粉色包,*tights* 字幕点题,情绪从严肃变成笑\n4-5s 变体1:黄色上衣 + 花朵黑裙 + 酒红鞋,用上衣和鞋做彩色呼应\n5-6s 变体2:粉色荷叶边上衣 + 深色短裤/裙 + 浅色裤袜,展示甜美复古方向\n7-8s 变体3:蓝绿印花上衣 + 粉色内搭 + 图案裙,先不给答案制造一次延迟\n8-9s 变体3完成:同造型补上芥末黄 tights,*tights* 字幕再次出现,强化“点睛单品”\n9-10.8s 变体4:奶油色外套和浅裙先素净出场,最后加薄荷蓝 tights 收尾,用最高反差色做记忆点", "shooting": "① 全程固定机位,背景是衣架、鞋架和粉色圆形鞋柜,天然交代“穿搭灵感库”场景\n② 剪辑靠换装跳切成立:先无裤袜,再同一姿势/同一构图补上亮色裤袜,对比成本低但信息很清楚\n③ 画面字幕极少,只用“少了什么”和“tights”两个信息点,静音刷也能懂\n④ 色彩策略明确:粉、黄、薄荷蓝等高饱和单品和鞋包/上衣呼应,把裤袜从实用品拍成造型主角\n⑤ 表演有轻微反差:开头表情严肃像在审视穿搭,答案出现后笑起来,让单品带来“完成感”\n⑥ 10.8秒内连续给4套搭配,节奏快,适合被保存成 outfit ideas", "template": "可复刻脚本(适合配饰/手机壳/鞋包/美甲等“点睛单品”):\n1️⃣ 0-2s:固定全身机位,先穿一套已经好看的基础造型,字幕写“my outfit's cute but it's missing something...”\n2️⃣ 2-4s:同机位跳切,加入你的点睛单品,字幕只写“* 单品名 *”\n3️⃣ 4-10s:连续给3-4套不同风格的搭配,每套都先展示缺口,再用同一个单品/同一类单品完成造型\n4️⃣ 10-12s:用颜色反差最强的一套收尾,让观众记住“原来差的是它”\n📌 关键:不要讲太多功能,让视觉前后对比替你解释\n📌 字幕:第一句制造缺口,第二句只给答案\n📌 场景:衣帽间、卧室镜前、玄关出门前都适合,背景里要有衣服/鞋/包增加真实感", "transcript": "", "bgm": {"title": "原声(未识别)", "artist": "", "file": "audio/DWbv77yiI35.mp3", "url": "assets/audio/DWbv77yiI35.mp3"}, "video_file": "videos/DWbv77yiI35.mp4", "cover": "frames/DWbv77yiI35/cover.jpg", "extracted": ["screen_text", "caption", "variants", "hook_type", "hook_visual", "hook_line", "hook_why", "structure", "shooting", "template", "transcript", "bgm", "category", "tags", "applied"], "applied": "◆ Ostand O3 Hue 套用方向\n这条适合套用:原片的核心是“穿搭已经不错,但缺一个让它完整的点睛单品”。O3 Hue 可以从“彩色裤袜”改成“撞色手机壳”,主打手机壳作为穿搭配饰/第二张脸,再顺手露出能支、能吸、能挂的功能。\n\n◆ 钩子改写(2个方案)\n方案1:固定全身机位,模特穿好 OOTD 但手里拿普通黑色手机壳,字幕 \"my outfit's cute but it's missing something...\"。下一秒换成和上衣/美甲/包包呼应的 O3 Hue,字幕 \"* phone case *\"(中译:手机壳)。\n方案2:桌面 GRWM 场景,手机本来靠在水杯上摇摇欲坠,字幕 \"my setup's cute but it's missing something...\"。跳切到 O3 Hue 圆环支架立住手机继续拍,字幕 \"* a case that stands *\"(中译:一个能自己站住的手机壳)。\n\n◆ 填好的脚本(11s)\n0-2s 钩子:衣帽间/卧室全身固定机位,模特拿手机看穿搭,字幕 \"my outfit's cute but it's missing something...\"\n2-4s 答案:手部特写换上 O3 Hue,撞色壳和美甲/包/鞋同色系呼应,字幕 \"* phone case *\"\n4-6s 造型1:镜前 selfie,手机壳在画面中心,强调“壳也是穿搭的一部分”\n6-8s 造型2:手机用圆环支架立在化妆台拍 GRWM,人走进画面摆 pose\n8-10s 造型3:手机吸在金属衣架/冰箱门上拍 OOTD,展示“吸”的隐藏机位\n10-11s 收尾:三套造型快闪 + 小字 \"stands, sticks & matches the fit\"(中译:能支、能吸,还能搭配穿搭)\n\n◆ 带卖点的字幕变体\n· my outfit's cute but it's missing a phone case(中译:我的穿搭很可爱,但还差一个手机壳)\n· when your case matches the fit and holds the shot(中译:手机壳既搭穿搭,又撑得住镜头)\n· one case, three outfits, zero tripod(中译:一个手机壳,三套穿搭,不用三脚架)\n· the phone case is part of the outfit now(中译:手机壳现在也是穿搭的一部分)\n\n◆ 拍摄注意\n① 每套衣服选一个和 O3 Hue 撞色壳呼应的细节:美甲、发夹、包、鞋、裤袜都可以\n② 先拍“没它也可以”的普通穿搭,再跳切到“有它才完整”,对比才成立\n③ 功能露出要生活化:支在化妆台、吸在金属架、挂在衣柜把手,不要像参数演示\n④ caption 可写:just a little color pop, but make it useful. link in bio(中译:一点点跳色,但还要真的好用。链接见主页)", "cover_url": "assets/covers/DWbv77yiI35.jpg", "video_url": "assets/videos/DWbv77yiI35_preview.mp4"}, {"id": "DcSsi5Qtxoq", "url": "https://www.instagram.com/reel/DcSsi5Qtxoq/", "added": "2026-08-22", "author": "@twinklestanly (Twinkle Stanly)", "duration": 9.5, "category": "场景痛点", "tags": ["独自旅行", "自拍幕后", "三脚架机位", "街头出片", "提问钩子", "成片证明"], "screen_text": "0-9.5s  “Who takes your photos when you’re solo traveling?”(独自旅行时谁帮你拍照?)\n(全片固定同一句提问字幕,白字黑描边,居中偏上)", "caption": "Oh I hustle I’ll tell you that 🎞️ @fujifilmitalia @fujifilmme sponsor me don’t be shy", "variants": ["Who takes your photos when you travel alone?(中译:你独自旅行时谁帮你拍照?)", "POV: you are your own photographer on every trip(中译:视角:每次旅行你都是自己的摄影师)", "No travel buddy? Still getting the shot.(中译:没有旅伴?照样拍到大片)", "solo trip, full camera roll(中译:一个人旅行,也能拍满相册)", "the girl behind every “who took this?” comment(中译:每条“谁帮你拍的?”评论背后的女生)"], "hook": "超广角自拍视角里,博主坐在佛罗伦萨街边,一手扶着架好相机的三脚架/独脚架,画面大字提问 “Who takes your photos when you’re solo traveling?”。问题先戳中独自旅行没人拍照的痛点,随后画面直接给答案:她自己架机位、自己跑位、自己出片。", "hook_type": "痛点提问型 + 幕后揭秘", "hook_visual": "超广角近距离自拍,博主坐在街边一手扶着相机三脚架,背景是欧洲老街和路人,画面带轻微晃动的真实感", "hook_line": "Who takes your photos when you’re solo traveling?(独自旅行时谁帮你拍照?)", "hook_why": "一句问题精准触发“独自旅行没人拍照”的共鸣,同时把三脚架/相机露出来制造“原来她这样拍”的揭秘感", "structure": "0-3s 钩子:超广角自拍从脸和手臂扫到相机三脚架,字幕提问“独自旅行时谁帮你拍照?”\n3-6s 幕后答案:镜头转向街角红色 FOTOMATICA 照相亭,相机架在前景,博主走到背景开始摆姿势\n6-8s 拍摄过程:三脚架/相机占右前景,人物在红黄撞色门面前站定,构图关系一眼看懂\n8-9.5s 成片证明:近距离拍 Fujifilm 相机背屏,屏幕里出现她在照相亭前的正式照片,用结果收尾\n(文案区用“我真的很努力”自嘲,强化一个人旅行也能拍大片的 hustle 感)", "shooting": "① 开头保留手持晃动和超广角畸变,像路人视角/自拍视频,真实感强\n② 字幕只用一句提问,白字黑描边居中,静音刷也能立刻理解冲突\n③ “问题→幕后→成片”三段极短闭环,9.5秒内给完整答案,完播压力小\n④ 三脚架和相机故意占画面前景,不是隐藏幕后,而是把“自己拍自己”变成内容核心\n⑤ 场景选择很会抓色:黄色墙面、红色照相亭、绿色流苏裙形成高辨识度街拍背景\n⑥ 结尾拍相机背屏,比直接放成片更有可信度,观众会相信这真是刚才那个机位拍出来的", "template": "可复刻脚本(适合“一个人也能完成X/自己搞定X”题材):\n1️⃣ 0-3s:用近距离自拍视频抛出痛点问题,同时让核心工具露出一点点\n2️⃣ 3-6s:拉开或切换视角,展示你怎么架工具/怎么准备动作\n3️⃣ 6-8s:让主体进入正式位置,保留工具在前景,观众能看懂拍摄关系\n4️⃣ 8-10s:给结果证明,最好用屏幕预览/前后对比/成片闪现收尾\n📌 字幕:全片只放一句问题句,不要解释太多\n📌 场景:选一个颜色有记忆点的背景,让成片本身值得停留\n📌 文案:自嘲式补一句“我真的很努力/没人帮我也能拍”,比硬教程更容易被评论接话", "transcript": "", "bgm": {"title": "原声(未识别)", "artist": "", "file": "audio/DcSsi5Qtxoq.mp3", "url": "assets/audio/DcSsi5Qtxoq.mp3"}, "video_file": "videos/DcSsi5Qtxoq.mp4", "cover": "frames/DcSsi5Qtxoq/cover.jpg", "extracted": ["screen_text", "caption", "variants", "hook_type", "hook_visual", "hook_line", "hook_why", "structure", "shooting", "template", "transcript", "bgm", "category", "tags", "applied"], "applied": "◆ Ostand O3 Hue 套用方向\n这条适合套用:原片核心是“独自旅行谁帮我拍?”的高共鸣痛点,答案是自己架相机。O3 Hue 可以把答案换成“我的手机壳就是机位”,自然展示圆环支架能立、磁吸能吸、圆环能挂,同时保留旅行/OOTD 出片氛围。\n\n◆ 钩子改写(2个方案)\n方案1:自拍镜头从脸扫到街边咖啡桌,手机靠 O3 Hue 圆环支架自己立着拍全身。字幕 “Who takes your photos when you’re solo traveling?”(独自旅行时谁帮你拍照?) 下一秒补一行 “my phone case does.”(我的手机壳帮我拍)。\n方案2:街头 OOTD 场景,手机吸在金属门/路牌上录全身,模特走回镜头取下手机,字幕 “No tripod. No travel buddy. Just my case.”(不用三脚架,不用旅伴,一个手机壳就够)。\n\n◆ 填好的脚本(9.5s)\n0-3s 钩子:超广角自拍视频,女生一边摆姿势一边把镜头扫到 O3 Hue 支着的手机,字幕原句提问\n3-6s 幕后答案:3个快切特写——圆环支架立在咖啡桌 / 手机吸在金属门 / 圆环挂在衣柜把手,都在拍她\n6-8s 成片场景:她走到街角/咖啡店门口摆好 OOTD,手机壳撞色在镜面或手部短暂出镜\n8-9.5s 收尾:手机屏幕里闪现刚拍到的全身照,字幕 “my case took it.”(我的手机壳拍的)\n文案区:who takes my photos when I travel alone? my Ostand O3 Hue case stands, sticks and hangs wherever I need a shot. comment “HUE” and I’ll send the link.(独旅自拍痛点+三卖点+评论暗号导流)\n\n◆ 带卖点的字幕变体\n· my phone case is my travel photographer now(我的手机壳现在是我的旅行摄影师)\n· it stands, sticks and hangs so I can shoot alone(能立、能吸、能挂,所以我一个人也能拍)\n· solo trip? the case has the angles(一个人旅行?这个壳自带机位)", "cover_url": "assets/covers/DcSsi5Qtxoq.jpg", "video_url": "assets/videos/DcSsi5Qtxoq_preview.mp4"}, {"id": "Daw2bXoSY79", "url": "https://www.instagram.com/reel/Daw2bXoSY79/", "added": "2026-08-24", "author": "@thesaltyfox_official (The Salty Fox)", "duration": 6.85, "category": "ASMR", "tags": ["手机吸盘贴", "解压小物", "hands-free-phone", "手机配件种草", "触觉ASMR", "创作者工具"], "screen_text": "0-6.85s  Me all day every day(中译:我每天一整天都这样)\n(全片固定同一句白色居中字幕,没有其他画面花字;字幕把“停不下来抠/按/玩”的重复动作变成共鸣梗)", "caption": "The most satisfying fidget toy for adults… oh it also allows you to use your phone hands free.\n\nThe ultimate tool for any phone user, mum, creator 🦊\n\nOur Double Sided Sticky Mounts are now LIVE!\n\n#asmr #iphoneaccessories #contentcreatortools", "variants": ["Me with my phone case all day every day(中译:我每天都在玩我的手机壳)", "Bought it for hands-free filming, stayed for the fidgeting(中译:本来为免手持拍摄买的,结果每天拿来解压)", "Adult fidget toy that also holds your phone(中译:成人解压玩具,顺便还能撑住手机)", "One sticky mount, endless little clicks(中译:一个粘贴小配件,无限小解压)", "Me pretending this is just a phone accessory(中译:我假装这只是一个手机配件)"], "hook": "超近景手部特写,长美甲不断抠起、按下手机背后的双面吸盘/粘贴垫,字幕固定 “Me all day every day”。开头先用重复触觉动作制造 ASMR 停留,再快速切到手机贴在厨房墙砖上使用,把“好玩”转成“有用”。", "hook_type": "触觉ASMR型 + 实用反转种草", "hook_visual": "粉橙撞色手机壳背面贴着黑色/粉色吸盘垫,手指反复抠边、按压小圆点、撕起再贴回;镜头贴得很近,美甲、戒指和胶垫质感是主要视觉焦点。", "hook_line": "Me all day every day(中译:我每天一整天都这样)", "hook_why": "“每天都忍不住玩”的一句话把产品从工具变成解压上瘾小物;重复抠按动作有声音和触觉想象,随后展示贴墙免手持,让观众同时获得爽感和购买理由。", "structure": "0-1.5s 钩子:手持粉色手机壳,拇指抠起黑色吸盘垫边缘,字幕 “Me all day every day”\n1.5-3s 功能证明:手机被按到厨房白色墙砖上,从“在手里玩”切到“能贴住手机免手持”\n3-5s ASMR循环:切回手机背面特写,手指反复按压/抠起黑色吸盘圆点,强调触感和粘性\n5-6.85s 颜色变体收尾:粉色吸盘垫贴在粉色手机壳上继续抠按,用同色系材质和美甲特写结束\n(文案区:先称它为“成人解压玩具”,再补一句也能 hands free 用手机,最后宣布双面粘贴支架已上线)", "shooting": "① 全片竖屏手部微距,镜头离产品很近,让手指、胶垫边缘、反光小圆点成为 ASMR 主体\n② 字幕只用一句固定梗,不解释参数,观众静音也能秒懂“停不下来玩”\n③ 先拍触觉上瘾,再拍厨房墙砖贴住手机,顺序是情绪留人→功能转化\n④ 美甲和戒指增强“成人解压玩具”的生活化质感,比裸手开箱更有社交媒体审美\n⑤ 粉 function entryText(e) {
  return [e.author, e.screen_text, e.caption, e.hook, e.hook_type, e.hook_visual, e.hook_line, e.hook_why, e.structure, e.shooting, e.template,
    e.transcript, (e.variants||[]).join(" "), (e.tags||[]).join(" "),
    e.category, e.bgm ? (e.bgm.title + " " + (e.bgm.artist||"")) : ""].join(" ").toLowerCase();
}

function bgmText(b) {
  if (!b) return "";
  return [b.title, b.artist].filter(Boolean).join(" — ") || "原声(未识别到曲名)";
}

function fieldContent(e, key) {
  switch (key) {
    case "copy": return [e.screen_text, (e.variants || []).join("\n")].filter(Boolean).join("\n\n");
    case "caption": return e.caption || "";
    case "hook":
      if (e.hook_visual || e.hook_line || e.hook_why) {
        return [
          e.hook_type ? "类型:" + e.hook_type : "",
          e.hook_visual ? "画面:" + e.hook_visual : "",
          e.hook_line ? "字幕:" + e.hook_line : "",
          e.hook_why ? "起效:" + e.hook_why : "",
        ].filter(Boolean).join("\n");
      }
      return e.hook ? (e.hook_type ? "【" + e.hook_type + "】" + e.hook : e.hook) : "";
    case "structure": return e.structure || "";
    case "shooting": return e.shooting || "";
    case "template": return e.template || "";
    case "transcript": return e.transcript || "";
    case "bgm": return bgmText(e.bgm);
    case "applied": return e.applied || "";
    default: return "";
  }
}

function visibleEntries() {
  let list = DATA.entries.slice().reverse();
  if (state.cat !== "_all") list = list.filter(e => e.category === state.cat);
  if (state.q) list = list.filter(e => entryText(e).includes(state.q));
  return list;
}

let toastTimer;
function toastMsg(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.classList.remove("show"); }, 1600);
}
function copy(text, btn, msg) {
  const done = () => {
    if (btn) { btn.classList.add("done"); const old = btn.textContent; btn.textContent = "✓"; setTimeout(() => { btn.classList.remove("done"); btn.textContent = old === "✓" ? "复制" : old; }, 1200); }
    toastMsg(msg || "已复制");
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) {}
  ta.remove();
}

async function saveBgm(e, btn) {
  if (e.bgm && e.bgm.url && !e.bgm.datauri) {
    window.open(e.bgm.url, "_blank", "noopener");
    return;
  }
  const downloads = window.claude ? await claude.use("downloads") : null;
  if (!downloads) { toastMsg("此环境不支持下载,请在 Codex 里说「发我音频」"); return; }
  try {
    btn.disabled = true;
    const b64 = e.bgm.datauri.split(",")[1];
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const name = (e.author || e.id || "bgm").replace(/[^\w\u4e00-\u9fa5-]+/g, "_").slice(0, 40);
    await downloads.save({ filename: name + "-bgm.mp4", data: bytes });
    toastMsg("已保存");
  } catch (err) {
    if (err && err.code === "declined") {}
    else if (err && err.code === "rate_limited") toastMsg("请稍等几秒再试");
    else toastMsg("下载暂不可用,请在 Codex 里说「发我音频」");
  } finally {
    btn.disabled = false;
  }
}

function coverSrc(e) { return e.cover_url || e.cover_datauri || ""; }
function videoSrc(e) { return e.video_url || e.video_datauri || ""; }
function bgmSrc(e) { return e.bgm ? (e.bgm.url || e.bgm.datauri || "") : ""; }

function mkBtn(text, label) {
  const b = document.createElement("button");
  b.className = "copy-btn"; b.textContent = "复制";
  b.setAttribute("aria-label", "复制" + (label || ""));
  b.addEventListener("click", (ev) => { ev.stopPropagation(); copy(text, b); });
  return b;
}

  }
}

function fillHookBody(e, body) {
  const rows = [
    ["类型", e.hook_type],
    ["画面", e.hook_visual],
    ["字幕", e.hook_line],
    ["起效", e.hook_why],
  ];
  rows.forEach(([label, val]) => {
    if (!val) return;
    const row = document.createElement("div"); row.className = "kv";
    const k = document.createElement("span"); k.className = "kv-k"; k.textContent = label;
    const v = mkText(val); v.classList.add("kv-v");
    if (label === "字幕") v.classList.add("kv-line");
    row.appendChild(k); row.appendChild(v);
    body.appendChild(row);
  });
}

const CIRCLED = "①②③④⑤⑥⑦⑧⑨⑩";

function transSplit(text) {
  const m = text.match(/^(.*?)\s*[((](?:(?:中译|原句)[::]?\s*)?([^()()]+)[))]\s*$/);
  if (m && /[一-鿿]/.test(m[2]) && /[A-Za-z]/.test(m[1])) {
    return { main: m[1], trans: m[2] };
  }
  return { main: text, trans: null };
}

function mkText(text) {
  const box = document.createElement("div"); box.className = "stext";
  const { main, trans } = transSplit(text);
  const mainEl = document.createElement("div"); mainEl.className = "line-main";
  const cm = main.match(/^([^::]{1,7})[::]\s*(.+)$/);
  if (cm && /[一-鿿]/.test(cm[1])) {
    const b = document.createElement("strong"); b.textContent = cm[1];
    mainEl.appendChild(b);
    mainEl.appendChild(document.createTextNode(" " + cm[2]));
  } else {
    mainEl.textContent = main;
  }
  box.appendChild(mainEl);
  if (trans) {
    const t = document.createElement("div"); t.className = "line-trans"; t.textContent = trans;
    box.appendChild(t);
  }
  return box;
}

function mkRow(body, leadEl, text) {
  const row = document.createElement("div"); row.className = "srow";
  if (leadEl) row.appendChild(leadEl);
  row.appendChild(mkText(text));
  body.appendChild(row);
}
function mkChip(label) {
  const c = document.createElement("span"); c.className = "tl-time"; c.textContent = label;
  return c;
}
function mkBadge(n) {
  const b = document.createElement("span"); b.className = "num-badge"; b.textContent = n;
  return b;
}

function smartFill(text, body) {
  let emojiNum = 0;
  (text || "").split("\n").forEach((raw) => {
    const line = raw.trim(); if (!line) return;
    let m;
    if ((m = line.match(/^(\d+(?:\.\d+)?\s*[-–~]\s*\d+(?:\.\d+)?\s*s)\s*(.*)$/i)) && m[2]) {
      mkRow(body, mkChip(m[1].replace(/\s+/g, "")), m[2]);
    } else if ((m = line.match(/^([1-9])️⃣\s*(.*)$/)) && m[2]) {
      mkRow(body, mkBadge(m[1]), m[2]);
    } else if (CIRCLED.includes(line[0])) {
      mkRow(body, mkBadge(CIRCLED.indexOf(line[0]) + 1), line.slice(1).trim());
    } else if ((m = line.match(/^(方案\s*\d+)[::]\s*(.*)$/)) && m[2]) {
      mkRow(body, mkChip(m[1].replace(/\s+/g, "")), m[2]);
    } else if ((m = line.match(/^[·•‧-]\s*(.+)$/))) {
      const dot = document.createElement("span"); dot.className = "dot";
      mkRow(body, dot, m[1]);
    } else if ((m = line.match(/^📌\s*(.*)$/))) {
      mkRow(body, mkChip("📌"), m[1]);
    } else if (/^[((].*[))]$/.test(line)) {
      const note = document.createElement("div"); note.className = "snote"; note.textContent = line.slice(1, -1);
      body.appendChild(note);
    } else {
      mkRow(body, null, line);
    }
  });
}

function fillStructureBody(e, body) { smartFill(e.structure, body); }
function fillShootingBody(e, body) { smartFill(e.shooting, body); }

function fillAppliedBody(e, body) {
  const blocks = (e.applied || "").split(/\n(?=◆)/);
  blocks.forEach((b) => {
    b = b.trim(); if (!b) return;
    const div = document.createElement("div"); div.className = "applied-block";
    const lines = b.split("\n");
    let rest = b;
    if (lines[0].startsWith("◆")) {
      const title = document.createElement("div"); title.className = "applied-title";
      title.textContent = lines[0].replace(/^◆\s*/, "");
      div.appendChild(title);
      rest = lines.slice(1).join("\n");
    }
    const txt = document.createElement("div"); txt.className = "field-body"; txt.style.marginTop = "0";
    smartFill(rest, txt);
    div.appendChild(txt);
    body.appendChild(div);
  });
}

function renderFieldBlock(e, key) {
  const content = fieldContent(e, key);
  if (!content) return null;
  const def = FIELD_DEFS.find(f => f.key === key);
  const div = document.createElement("div"); div.className = "field";
  const head = document.createElement("div"); head.className = "field-head";
  const name = document.createElement("span"); name.className = "field-name"; name.textContent = def.label;
  head.appendChild(name);
  if (key !== "copy") head.appendChild(mkBtn(content, def.label));
  div.appendChild(head);

  const body = document.createElement("div"); body.className = "field-body";
  if (key === "copy") {
    fillCopyBody(e, body);
    div.appendChild(body);
    return div;
  }
  if (key === "hook" && (e.hook_visual || e.hook_line || e.hook_why)) {
    fillHookBody(e, body);
    div.appendChild(body);
    return div;
  }
  if (key === "structure" && e.structure) {
    fillStructureBody(e, body);
    div.appendChild(body);
    return div;
  }
  if (key === "shooting" && e.shooting) {
    fillShootingBody(e, body);
    div.appendChild(body);
    return div;
  }
  if (key === "template" && e.template) {
    smartFill(e.template, body);
    div.appendChild(body);
    return div;
  }
  if (key === "applied" && e.applied) {
    fillAppliedBody(e, body);
    div.appendChild(body);
    return div;
  }
  if (key === "bgm" && e.bgm && bgmSrc(e)) {
    const info = document.createElement("div"); info.textContent = content;
    const audio = document.createElement("audio");
    audio.controls = true; audio.preload = "none"; audio.src = bgmSrc(e);
    audio.style.width = "100%"; audio.style.marginTop = "6px";
    const dl = document.createElement("button");
    dl.className = "copy-btn"; dl.textContent = "下载音频"; dl.style.marginTop = "6px";
    dl.addEventListener("click", () => saveBgm(e, dl));
    body.appendChild(info); body.appendChild(audio); body.appendChild(dl);
  } else if (key === "variants" && (e.variants || []).length > 1) {
    e.variants.forEach((v) => {
      const row = document.createElement("div"); row.className = "variant";
      const span = document.createElement("span"); span.textContent = v;
      row.appendChild(span); row.appendChild(mkBtn(v, "变体"));
      body.appendChild(row);
    });
  } else {
    body.textContent = content;
  }
  div.appendChild(body);
  return div;
}

function renderDetail(e) {
  const box = document.createElement("div"); box.className = "detail";
  const head = document.createElement("div"); head.className = "detail-head";
  const vsrc = videoSrc(e);
  const csrc = coverSrc(e);
  if (vsrc) {
    const video = document.createElement("video");
    video.controls = true; video.playsInline = true; video.preload = "none";
    video.src = vsrc;
    if (csrc) video.poster = csrc;
    video.className = "d-video";
    head.appendChild(video);
  } else if (csrc) {
    const img = document.createElement("img"); img.src = csrc; img.alt = "封面"; img.loading = "lazy";
    head.appendChild(img);
  }
  const meta = document.createElement("div");
  const author = document.createElement("div"); author.className = "d-author"; author.textContent = e.author || "未知作者";
  const sub = document.createElement("div"); sub.className = "d-sub";
  sub.textContent = (e.added || "") + (e.duration ? " · " + Math.round(e.duration) + "s" : "") + " · ";
  if (e.url) {
    const a = document.createElement("a"); a.href = e.url; a.target = "_blank"; a.rel = "noopener";
    a.textContent = "打开原视频 ↗"; sub.appendChild(a);
  }
  meta.appendChild(author); meta.appendChild(sub);
  if (e.category) {
    const c = document.createElement("div");
    const tag = document.createElement("span"); tag.className = "cat-tag"; tag.textContent = e.category;
    c.appendChild(tag); meta.appendChild(c);
  }
  if ((e.tags || []).length) {
    const t = document.createElement("div"); t.className = "d-tags"; t.textContent = "# " + e.tags.join("  # ");
    meta.appendChild(t);
  }
  head.appendChild(meta);
  const close = document.createElement("button");
  close.className = "detail-close"; close.textContent = "关闭";
  close.addEventListener("click", () => { document.body.classList.remove("detail-open"); });
  head.appendChild(close);
  box.appendChild(head);

  const GROUPS = [
    { key: "copy",    label: "文案",         fields: ["copy", "caption"] },
    { key: "anatomy", label: "拆解",         fields: ["hook", "structure", "shooting", "template"] },
    { key: "applied", label: "套用到我的产品", fields: ["applied"] },
    { key: "assets",  label: "素材",         fields: ["bgm", "transcript"] },
  ];
  const avail = GROUPS.filter(g => g.fields.some(k => fieldContent(e, k)));
  if (!avail.find(g => g.key === state.dtab)) state.dtab = avail.length ? avail[0].key : null;

  const tabs = document.createElement("div"); tabs.className = "dtabs";
  avail.forEach(g => {
    const t = document.createElement("button");
    t.className = "dtab" + (state.dtab === g.key ? " on" : "");
    t.textContent = g.label;
    t.addEventListener("click", () => {
      state.dtab = g.key;
      const openOnMobile = document.body.classList.contains("detail-open");
      render();
      if (openOnMobile) document.body.classList.add("detail-open");
    });
    tabs.appendChild(t);
  });
  box.appendChild(tabs);

  const active = avail.find(g => g.key === state.dtab);
  if (active) {
    active.fields.forEach(k => {
      const block = renderFieldBlock(e, k);
      if (block) box.appendChild(block);
    });
  }

  return box;
}

function renderRead(list) {
  const split = document.createElement("div"); split.className = "split";
  const listBox = document.createElement("div"); listBox.className = "list";
  if (!list.find(e => e.id === state.sel)) state.sel = list.length ? list[0].id : null;

  list.forEach(e => {
    const item = document.createElement("button");
    item.className = "item" + (e.id === state.sel ? " on" : "");
    const csrc = coverSrc(e);
    if (csrc) {
      const img = document.createElement("img"); img.src = csrc; img.alt = ""; img.loading = "lazy";
      item.appendChild(img);
    }
    const m = document.createElement("div"); m.className = "i-meta";
    const a = document.createElement("div"); a.className = "i-author"; a.textContent = e.author || "未知作者";
    const s = document.createElement("div"); s.className = "i-sub";
    s.textContent = [e.category, e.hook_type, e.duration ? Math.round(e.duration) + "s" : ""].filter(Boolean).join(" · ");
    const h = document.createElement("div"); h.className = "i-hook"; h.textContent = e.hook_line || e.hook || e.screen_text || "";
    m.appendChild(a); m.appendChild(s); m.appendChild(h);
    item.appendChild(m);
    item.addEventListener("click", () => {
      state.sel = e.id;
      render();
      if (window.matchMedia("(max-width: 799px)").matches) document.body.classList.add("detail-open");
    });
    listBox.appendChild(item);
  });
  split.appendChild(listBox);

  const cur = list.find(e => e.id === state.sel);
  if (cur) split.appendChild(renderDetail(cur));
  return split;
}

function renderWall(list) {
  const wall = document.createElement("div"); wall.className = "wall";
  list.forEach(e => {
    const tile = document.createElement("button"); tile.className = "tile";
    tile.setAttribute("aria-label", (e.author || "") + " " + (e.category || ""));
    const csrc = coverSrc(e);
    if (csrc) {
      const img = document.createElement("img"); img.src = csrc; img.alt = ""; img.loading = "lazy";
      tile.appendChild(img);
    }
    const info = document.createElement("span"); info.className = "tile-info";
    const au = document.createElement("span"); au.className = "t-author"; au.textContent = e.author || "";
    const sb = document.createElement("span"); sb.className = "t-sub";
    sb.textContent = [e.category, e.duration ? Math.round(e.duration) + "s" : ""].filter(Boolean).join(" · ");
    info.appendChild(au); info.appendChild(sb);
    tile.appendChild(info);
    tile.addEventListener("click", () => {
      state.sel = e.id; state.view = "read";
      render();
      if (window.matchMedia("(max-width: 799px)").matches) document.body.classList.add("detail-open");
    });
    wall.appendChild(tile);
  });
  return wall;
}

function renderFocus(list, key) {
  const box = document.createElement("div"); box.className = "focus-list";
  const def = FIELD_DEFS.find(f => f.key === key);
  list.forEach(e => {
    const content = fieldContent(e, key);
    if (!content) return;
    const card = document.createElement("div"); card.className = "focus-card";
    const meta = document.createElement("div"); meta.className = "f-meta";
    const csrc = coverSrc(e);
    if (csrc) {
      const img = document.createElement("img"); img.src = csrc; img.alt = ""; img.loading = "lazy";
      meta.appendChild(img);
    }
    const mm = document.createElement("div");
    const au = document.createElement("div"); au.className = "f-author"; au.textContent = e.author || "";
    const ct = document.createElement("div"); ct.className = "f-cat"; ct.textContent = e.category || "";
    mm.appendChild(au); mm.appendChild(ct);
    meta.appendChild(mm);
    const spacer = document.createElement("div"); spacer.style.marginLeft = "auto";
    spacer.appendChild(mkBtn(content, def.label));
    meta.appendChild(spacer);
    card.appendChild(meta);

    const body = document.createElement("div"); body.className = "field-body"; body.style.marginTop = "0";
    if (key === "copy") {
      fillCopyBody(e, body);
      card.appendChild(body);
      box.appendChild(card);
      return;
    }
    if (key === "hook" && (e.hook_visual || e.hook_line || e.hook_why)) {
      fillHookBody(e, body);
      card.appendChild(body);
      box.appendChild(card);
      return;
    }
    if (key === "structure" && e.structure) {
      fillStructureBody(e, body);
      card.appendChild(body); box.appendChild(card); return;
    }
    if (key === "shooting" && e.shooting) {
      fillShootingBody(e, body);
      card.appendChild(body); box.appendChild(card); return;
    }
    if (key === "template" && e.template) {
      smartFill(e.template, body);
      card.appendChild(body); box.appendChild(card); return;
    }
    if (key === "applied" && e.applied) {
      fillAppliedBody(e, body);
      card.appendChild(body); box.appendChild(card); return;
    }
    if (key === "bgm" && e.bgm && bgmSrc(e)) {
      const info = document.createElement("div"); info.textContent = content;
      const audio = document.createElement("audio");
      audio.controls = true; audio.preload = "none"; audio.src = bgmSrc(e);
      audio.style.width = "100%"; audio.style.marginTop = "6px";
      const dl = document.createElement("button");
      dl.className = "copy-btn"; dl.textContent = "下载音频"; dl.style.marginTop = "6px";
      dl.addEventListener("click", () => saveBgm(e, dl));
      body.appendChild(info); body.appendChild(audio); body.appendChild(dl);
    } else if (key === "variants" && (e.variants || []).length > 1) {
      e.variants.forEach((v) => {
        const row = document.createElement("div"); row.className = "variant";
        const span = document.createElement("span"); span.textContent = v;
        row.appendChild(span); row.appendChild(mkBtn(v, "变体"));
        body.appendChild(row);
      });
    } else {
      body.textContent = content;
    }
    card.appendChild(body);
    box.appendChild(card);
  });
  return box;
}

function render() {
  const main = $("main"); main.innerHTML = "";
  document.body.classList.remove("detail-open");
  const list = visibleEntries();

  $("vt-read").className = state.view === "read" ? "on" : "";
  $("vt-wall").className = state.view === "wall" ? "on" : "";
  $("vt-read").setAttribute("aria-selected", state.view === "read");
  $("vt-wall").setAttribute("aria-selected", state.view === "wall");

  if (state.field !== "_all") {
    main.appendChild(renderFocus(list, state.field));
  } else if (state.view === "wall") {
    main.appendChild(renderWall(list));
  } else {
    main.appendChild(renderRead(list));
  }

  $("empty").hidden = DATA.entries.length > 0;
  $("count").textContent = DATA.entries.length
    ? "共 " + DATA.entries.length + " 条" + (list.length !== DATA.entries.length ? " · 筛出 " + list.length + " 条" : "")
    : "";
}

function renderChips(containerId, items, stateKey) {
  const box = $(containerId); box.innerHTML = "";
  items.forEach(({ key, label }) => {
    const b = document.createElement("button");
    b.className = "chip" + (state[stateKey] === key ? " on" : "");
    b.textContent = label;
    b.addEventListener("click", () => { state[stateKey] = key; renderChips(containerId, items, stateKey); render(); });
    box.appendChild(b);
  });
}

const cats = [{ key: "_all", label: "全部" }].concat(
  [...new Set(DATA.entries.map(e => e.category).filter(Boolean))].map(c => ({ key: c, label: c }))
);
renderChips("cats", cats, "cat");
renderChips("fields-chips", FIELD_DEFS, "field");
$("q").addEventListener("input", (ev) => { state.q = ev.target.value.trim().toLowerCase(); render(); });
$("vt-read").addEventListener("click", () => { state.view = "read"; render(); });
$("vt-wall").addEventListener("click", () => { state.view = "wall"; render(); });
render();
</script>
