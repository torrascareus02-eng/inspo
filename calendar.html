 {id:'p3',date:'2026-09-15',type:'shoot',title:'Color-match OOTD · pink + cherry red',status:'todo',note:'撞色穿搭 + mirror selfie；拍 9:16，预留 3 个封面。'},
 {id:'p4',date:'2026-09-18',type:'publish',title:'The tiny phone case that stands anywhere',status:'todo',note:'0-3s 视觉悬念；中译：随处站立的手机壳。'},
