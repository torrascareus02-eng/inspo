<!doctype html>
<meta charset="utf-8" />

<title>短视频数据工作台</title>
<style>
  :root{--bg:#f7f8fb;--surface:#fff;--ink:#19202b;--muted:#7d8796;--line:#e4e8ef;--accent:#4867e8;--soft:#eef1ff;--shadow:0 8px 24px rgba(32,45,76,.06)}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 20px 70px}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}h1{font-size:25px;margin:0;letter-spacing:-.02em}.dot{color:var(--accent)}.count{color:var(--muted);margin-right:auto;font-size:13px}.nav{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:5px 11px;text-decoration:none;font-size:13px}.nav:hover{border-color:var(--accent);color:var(--accent)}
  .hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin:24px 0 16px}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:.15em;font-weight:800}.hero h2{font-size:22px;margin:2px 0}.hero p{color:var(--muted);margin:0;font-size:12px}.tabs{display:flex;gap:6px}.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;color:var(--muted);cursor:pointer;font:inherit;font-size:12px}.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.metric{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 15px;box-shadow:var(--shadow)}.metric-label{color:var(--muted);font-size:12px}.metric-value{font-size:25px;font-weight:750;line-height:1.2;margin:5px 0 2px;font-variant-numeric:tabular-nums}.metric-hint{color:var(--muted);font-size:11px}.foot{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin:10px 2px 26px}.foot strong{color:var(--ink)}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.panel-head{display:flex;align-items:center;gap:12px;padding:15px 17px;border-bottom:1px solid var(--line)}.panel-head h3{margin:0;font-size:15px}.search{margin-left:auto;border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:240px;outline:none;font:inherit;font-size:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:780px}th,td{text-align:left;padding:12px 15px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:11px;font-weight:600;white-space:nowrap;background:#fbfcfe}td{font-size:13px}.post{display:flex;gap:10px;min-width:235px}.cover{width:42px;height:56px;object-fit:cover;border-radius:7px;background:#edf0f5;flex:0 0 auto}.author{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}.sub{color:var(--muted);font-size:11px}.caption{max-width:350px;color:#4f5a6a;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.num{font-variant-numeric:tabular-nums;font-weight:650}.pending{color:#a5adba;font-weight:400}.platform{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--accent);white-space:nowrap}.platform.tk{background:#e4faf7;color:#008d87}.open{color:var(--accent);text-decoration:none;white-space:nowrap}.empty{text-align:center;padding:50px;color:var(--muted)}.link-entry{display:flex;gap:8px;margin:0 0 14px}.link-entry input{flex:1;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font:inherit;font-size:13px;color:var(--ink);background:var(--surface)}.link-entry input:focus{outline:2px solid var(--soft);border-color:var(--accent)}.link-entry button{border:0;border-radius:9px;padding:0 16px;background:var(--accent);color:#fff;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.entry-panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin-bottom:18px}.entry-panel summary{cursor:pointer;font-weight:700;color:var(--accent)}.entry-form{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:14px}.entry-form label{display:grid;gap:4px;color:var(--muted);font-size:11px}.entry-form input,.entry-form textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 9px;font:inherit;font-size:12px;color:var(--ink);background:var(--surface)}.entry-form .wide{grid-column:span 2}.entry-form textarea{min-height:38px;resize:vertical}.entry-actions{display:flex;gap:8px;align-items:end}.entry-actions button{border:0;border-radius:8px;padding:8px 12px;background:var(--accent);color:#fff;cursor:pointer;font:inherit;font-size:12px;font-weight:700}.entry-actions button.secondary{background:var(--soft);color:var(--accent)}.periods{display:flex;gap:6px;margin-bottom:13px}.period{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer;font:inherit;font-size:12px}.period.on{background:var(--ink);border-color:var(--ink);color:#fff}
  @media(max-width:800px){.hero{align-items:flex-start;flex-direction:column}.metrics{grid-template-columns:repeat(2,1fr)}.metric:last-child{grid-column:span 2}.search{width:160px}}@media(max-width:480px){.wrap{padding:20px 12px}.metrics{gap:7px}.metric{padding:11px}.metric-value{font-size:21px}.panel-head{align-items:flex-start;flex-wrap:wrap}.search{margin-left:0;width:100%}}
  .sync-panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 18px;box-shadow:var(--shadow)}.sync-panel summary{cursor:pointer;color:var(--accent);font-weight:700}.sync-row{display:flex;gap:8px;margin-top:10px}.sync-row input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:12px}.sync-row button{border:0;border-radius:8px;padding:8px 12px;background:var(--soft);color:var(--accent);font:inherit;font-size:12px;font-weight:700;cursor:pointer}.sync-status{color:var(--muted);font-size:11px;margin-top:7px}
</style>
<div class="wrap">
  <header><h1>短视频数据工作台<span class="dot">.</span></h1><span class="count" id="count"></span><a class="nav" href="viewer.html">▦ 灵感库</a><a class="nav" href="calendar.html">◷ 发布日历</a></header>
  <section class="hero"><div><div class="eyebrow">CONTENT INTELLIGENCE · 独立数据源</div><h2>IG / TK 内容表现总览</h2><p>仅读取 dashboard.json，不读取 Reels 灵感库。</p></div><div class="tabs" id="tabs"></div></section>
  <div class="link-entry"><input id="link-input" type="url" placeholder="粘贴 Instagram / TikTok 链接后录入"><button id="add-link">录入链接</button></div>
  <details class="sync-panel"><summary>☁ 共享数据源（网站看板后台）</summary><div class="sync-row"><input id="api-input" type="url" placeholder="Google Sheet 或共享接口地址"><button id="save-api">保存数据源</button><button id="pull-api">立即同步</button></div><div class="sync-status" id="sync-status">网站看板读取共享数据源；录入人员不需要打开看板后台。</div></details>
  <details class="entry-panel"><summary>＋ 录入无法自动读取的互动数据（播放 / 点赞 / 评论 / 收藏 / 转发）</summary><form class="entry-form" id="entry-form"><input type="hidden" id="f-url"><input type="hidden" id="f-author"><input type="hidden" id="f-date"><input type="hidden" id="f-caption"><label>播放<input id="f-views" type="number" min="0" placeholder="0"></label><label>点赞<input id="f-likes" type="number" min="0" placeholder="0"></label><label>评论<input id="f-comments" type="number" min="0" placeholder="0"></label><label>收藏<input id="f-saves" type="number" min="0" placeholder="0"></label><label>转发<input id="f-shares" type="number" min="0" placeholder="0"></label><div class="entry-actions"><button type="submit">保存到工作台</button><button class="secondary" type="button" id="export-data">导出 JSON</button></div></form></details>
  <div class="periods" id="periods"><button class="period on" data-period="all">全部</button><button class="period" data-period="day">日</button><button class="period" data-period="week">周</button><button class="period" data-period="month">月</button></div>
  <section class="metrics" id="metrics"></section>
  <div class="foot"><span id="source"></span><span>平均互动率 <strong id="rate">—</strong></span></div>
  <section class="panel"><div class="panel-head"><h3>内容表现明细</h3><input class="search" id="search" placeholder="搜索作者、文案或链接…" /></div><div class="table-wrap"><table><thead><tr><th>内容</th><th>文案</th><th>播放</th><th>点赞</th><th>评论</th><th>收藏</th><th>转发</th><th>链接</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty" hidden>没有匹配的内容</div></div></section>
</div>
<script>
const DATA=/*__LIBRARY_DATA__*/{"entries": [{"id": "7697654329083170062", "url": "https://www.tiktok.com/@laylaspalette/video/7697654329083170062", "added": "2026-10-17", "date": "2026-10-17", "author": "@laylaspalette", "caption": "#fallvibes #fallaesthetic", "theme": "秋日氛围 / Fall aesthetic"}, {"id": "7697440470963653901", "url": "https://www.tiktok.com/@laylaspalette/video/7697440470963653901", "added": "2026-10-16", "date": "2026-10-16", "author": "@laylaspalette", "caption": "yeah, I’m in my element 🍂🎃👻🤎#spookyseason #halloweenvibes #phonecase #halloween #halloweenphonecase", "theme": "万圣节手机壳 / Halloween phone case"}, {"id": "7696908419051146510", "url": "https://www.tiktok.com/@laylaspalette/video/7696908419051146510", "added": "2026-10-15", "date": "2026-10-15", "author": "@laylaspalette", "caption": "my phone case is basically a mini tripod now and I'm kinda obsessed ☺️🤌🏻🧡#phonecases #cutephonecase #iphone18pro #phoneaccessories #minitripod", "theme": "手机壳支架功能 / Mini tripod"}, {"id": "7696551429468704014", "url": "https://www.tiktok.com/@laylaspalette/video/7696551429468704014", "added": "2026-10-14", "date": "2026-10-14", "author": "@laylaspalette", "caption": "the only thing i need this fall🤎🍂#fallvibes🍂 #iphone18 #fallaesthetic #fallmood #cutephonecase", "theme": "秋日必备单品 / Fall essential"}, {"id": "7696342663301238029", "url": "https://www.tiktok.com/@laylaspalette/video/7696342663301238029", "added": "2026-10-13", "date": "2026-10-13", "author": "@laylaspalette", "caption": "officially in my fall era and this fall coded phone case fits right in 🍂🧡 obsessed☺️🎃☕️#iphone18 #iphonecase #fallvibes🍂 #fallaesthetic #cutephonecase", "theme": "秋日风格融入 / Fall-coded styling"}, {"id": "7695814967643180302", "url": "https://www.tiktok.com/@laylaspalette/video/7695814967643180302", "added": "2026-10-12", "date": "2026-10-12", "author": "@laylaspalette", "caption": "cards + lipstick in one, that’s the move 🍷💄#iphone18 #cardholder #phoneaccessories", "theme": "卡包手机壳 / Cardholder phone case"}]}/*__END__*/;
const STORE="torras-dashboard-entries-v1",OVERRIDES="torras-dashboard-metrics-v1";const $=id=>document.getElementById(id);const saved=JSON.parse(localStorage.getItem(STORE)||"[]"),overrides=JSON.parse(localStorage.getItem(OVERRIDES)||"{}");const state={platform:"all",q:"",period:"all"};const entries=()=>DATA.entries.map(e=>({...e,metrics:{...(e.metrics||{}),...(overrides[e.id]?.metrics||{})}})).concat(saved.filter(x=>!DATA.entries.some(e=>e.id===x.id)));
function platformOf(e){const u=String(e.url||"").toLowerCase();return u.includes("tiktok.com")||u.includes("vm.tiktok")?"tk":u.includes("instagram.com")?"ig":"other"}
function metricOf(e,key){const m=e.metrics||e.statistics||{};const a={views:["views","plays","play_count"],likes:["likes","like_count"],comments:["comments","comment_count"],saves:["saves","收藏"],shares:["shares","share_count","转发"]};for(const k of a[key]||[]){const v=m[k]??e[k];if(v!==undefined&&v!==null&&v!=="")return Number(v)||0}return null}
function fmt(v){if(v===null)return "待同步";if(v>=1e6)return(v/1e6).toFixed(1).replace(/\.0$/,'')+'M';if(v>=1e3)return(v/1e3).toFixed(1).replace(/\.0$/,'')+'K';return v.toLocaleString('zh-CN')}
let activeEntry=null;function prefill(e){if(!e)return;activeEntry=e;document.querySelector('.entry-panel').open=true;$('f-url').value=e.url||'';$('f-author').value=e.author||'';$('f-date').value=e.date||e.added||new Date().toISOString().slice(0,10);$('f-caption').value=e.caption||'';['views','likes','comments','saves','shares'].forEach(k=>{$('f-'+k).value=metricOf(e,k)??''});document.querySelector('.entry-panel').scrollIntoView({behavior:'smooth',block:'start'});$('f-views').focus()}
function editMetric(e,key,cell){const input=document.createElement('input');input.type='number';input.min='0';input.value=metricOf(e,key)??'';input.style='width:72px;border:1px solid var(--accent);border-radius:6px;padding:5px;font:inherit;color:var(--ink)';cell.textContent='';cell.appendChild(input);input.focus();const save=()=>{const value=input.value.trim()===''?null:Number(input.value);if(value!==null){if(DATA.entries.some(x=>x.id===e.id)){overrides[e.id]={...(overrides[e.id]||{}),metrics:{...(overrides[e.id]?.metrics||{}),[key]:value}};localStorage.setItem(OVERRIDES,JSON.stringify(overrides))}else{const target=saved.find(x=>x.id===e.id);if(target){target.metrics={...(target.metrics||{}),[key]:value};localStorage.setItem(STORE,JSON.stringify(saved))}}}render()};input.onblur=save;input.onkeydown=ev=>{if(ev.key==='Enter')input.blur();if(ev.key==='Escape'){input.onblur=null;render()}}}
function inPeriod(e){if(state.period==='all')return true;const d=new Date((e.date||e.added||'')+'T12:00:00'),now=new Date();if(Number.isNaN(d.getTime()))return false;const days=(now-d)/86400000;return state.period==='day'?days>=0&&days<1:state.period==='week'?days>=0&&days<7: d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()}
function list(){return entries().filter(e=>state.platform==='all'||platformOf(e)===state.platform).filter(inPeriod).filter(e=>!state.q||[e.author,e.caption,e.url].join(' ').toLowerCase().includes(state.q)).sort((a,b)=>String(b.date||b.added||'').localeCompare(String(a.date||a.added||'')))}
function render(){const tabs=[['all','全部'],['ig','Instagram'],['tk','TikTok']];$('tabs').innerHTML='';tabs.forEach(([k,l])=>{const b=document.createElement('button');b.className='tab'+(state.platform===k?' on':'');b.textContent=l;b.onclick=()=>{state.platform=k;render()};$('tabs').appendChild(b)});const items=list();const labels={views:'播放',likes:'点赞',comments:'评论',saves:'收藏',shares:'转发'};$('metrics').innerHTML='';Object.entries(labels).forEach(([k,l])=>{const vs=items.map(e=>metricOf(e,k)).filter(v=>v!==null);const total=vs.length?vs.reduce((a,b)=>a+b,0):null;const d=document.createElement('div');d.className='metric';d.innerHTML=`<div class="metric-label">${l}</div><div class="metric-value">${fmt(total)}</div><div class="metric-hint">${vs.length?vs.length+' 条已同步':'链接数据待同步'}</div>`;$('metrics').appendChild(d)});const known=items.filter(e=>metricOf(e,'views')!==null&&metricOf(e,'likes')!==null);const rate=known.length?known.reduce((s,e)=>s+metricOf(e,'likes')/Math.max(metricOf(e,'views'),1),0)/known.length:null;$('source').textContent=`${items.length} 条链接 · ${state.platform==='all'?'IG + TK':state.platform==='ig'?'Instagram':'TikTok'}`;$('rate').textContent=rate===null?'—':(rate*100).toFixed(2)+'%';$('count').textContent=`${DATA.entries.length} 条内容`;
  const rows=$('rows');rows.innerHTML='';items.forEach(e=>{const tr=document.createElement('tr');const p=platformOf(e);const vals=['views','likes','comments','saves','shares'].map(k=>{const v=metricOf(e,k);return `<td class="num ${v===null?'pending':''}">${fmt(v)}</td>`}).join('');const media=e.video_url?`<video class="cover" src="${e.video_url}" poster="${e.cover_url||''}" controls preload="metadata"></video>`:(e.cover_url||e.cover_datauri?`<img class="cover" src="${e.cover_url||e.cover_datauri}" alt="">`:'');tr.innerHTML=`<td><div class="post">${media}<div><div class="author">${e.author||'未知作者'}</div><div class="sub"><span class="platform ${p}">${p==='tk'?'TikTok':p==='ig'?'Instagram':'其他'}</span> · ${e.date||e.added||''}</div></div></div></td><td><div class="caption">${e.caption||'暂无文案'}</div></td>${vals}<td>${e.url?`<a class="open" href="${e.url}" target="_blank" rel="noopener">打开 ↗</a>`:'—'}</td>`;rows.appendChild(tr)});$('empty').hidden=items.length>0}
$('search').oninput=e=>{state.q=e.target.value.trim().toLowerCase();render()};$('rows').addEventListener('click',e=>{const link=e.target.closest('.open');if(link){e.preventDefault();prefill(entries().find(x=>x.url===link.href||x.url===link.getAttribute('href')));return}const cell=e.target.closest('td.num');if(cell){const row=cell.parentNode,index=Array.from(row.children).indexOf(cell),key=['views','likes','comments','saves','shares'][index-2];if(key)editMetric(entries().find(x=>x.id===row.dataset.id),key,cell)}});document.querySelectorAll('.period').forEach(b=>b.onclick=()=>{state.period=b.dataset.period;document.querySelectorAll('.period').forEach(x=>x.classList.toggle('on',x===b));render()});$('f-date').value=new Date().toISOString().slice(0,10);$('entry-form').onsubmit=e=>{e.preventDefault();const item={id:'manual-'+Date.now(),url:$('f-url').value.trim(),author:$('f-author').value.trim(),date:$('f-date').value,added:$('f-date').value,caption:$('f-caption').value.trim(),metrics:{views:+$('f-views').value||0,likes:+$('f-likes').value||0,comments:+$('f-comments').value||0,saves:+$('f-saves').value||0,shares:+$('f-shares').value||0}};saved.push(item);localStorage.setItem(STORE,JSON.stringify(saved));e.target.reset();$('f-date').value=new Date().toISOString().slice(0,10);render()};$('export-data').onclick=()=>{const blob=new Blob([JSON.stringify({entries:entries()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dashboard-data.json';a.click();URL.revokeObjectURL(a.href)};render();
</script>
<script>
const safeEditMetric=editMetric;editMetric=(entry,key,cell)=>{if(entry)safeEditMetric(entry,key,cell)};$('rows').addEventListener('click',ev=>{const cell=ev.target.closest('td.num');if(!cell)return;const row=cell.parentNode,href=row.querySelector('.open')?.getAttribute('href'),entry=entries().find(x=>x.url===href),index=Array.from(row.children).indexOf(cell),key=['views','likes','comments','saves','shares'][index-2];if(key)editMetric(entry,key,cell)});

<script>
document.querySelector('.entry-panel summary').textContent='＋ 录入无法自动读取的互动数据（播放 / 点赞 / 评论 / 收藏 / 转发）';

<script>
$('add-link').onclick=()=>{const url=$('link-input').value.trim();if(!url)return $('link-input').focus();const today=new Date().toISOString().slice(0,10),item={id:'manual-'+Date.now(),url,author:'',date:today,added:today,caption:'',metrics:{}};saved.push(item);localStorage.setItem(STORE,JSON.stringify(saved));syncUp(item);$('link-input').value='';render();prefill(item)};

<script>
const API_STORE='torras-dashboard-api-v1';const DEFAULT_SHEET='https://docs.google.com/spreadsheets/d/1dfZJ2Ts4k8ghemzF0SMXmUdXvQREqmRLeWBTjnLC9uU/edit#gid=1398611631';let sharedApi=localStorage.getItem(API_STORE)||new URLSearchParams(location.search).get('api')||DEFAULT_SHEET;$('api-input').value=sharedApi;
function syncStatus(message,error=false){$('sync-status').textContent=message;$('sync-status').style.color=error?'#c24b4b':'var(--muted)'}
async function syncUp(entry){if(!sharedApi)return;try{const response=await fetch(sharedApi,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'upsert',entry})});const result=await response.json();if(!result.ok)throw new Error(result.error||'接口返回失败');syncStatus('已同步到共享数据源：'+new Date().toLocaleTimeString())}catch(error){syncStatus('同步失败：'+error.message+'；本机数据仍已保存。',true)}}
async function pullShared(){if(!sharedApi)return syncStatus('请先粘贴共享接口地址。',true);syncStatus('正在读取共享数据…');try{const response=await fetch(sharedApi,{cache:'no-store'});const result=await response.json();if(!Array.isArray(result.entries))throw new Error('返回格式不正确');DATA.entries=result.entries;render();syncStatus('已读取 '+result.entries.length+' 条共享数据：'+new Date().toLocaleTimeString())}catch(error){syncStatus('读取失败：'+error.message,true)}}
$('save-api').onclick=()=>{sharedApi=$('api-input').value.trim().replace(/\/$/,'');if(sharedApi)localStorage.setItem(API_STORE,sharedApi);else localStorage.removeItem(API_STORE);syncStatus(sharedApi?'接口已保存，可点击“立即同步”。':'已清除共享接口。')};$('pull-api').onclick=pullShared;if(sharedApi)pullShared();
$('entry-form').addEventListener('submit',()=>setTimeout(()=>syncUp(saved[saved.length-1]),0));$('rows').addEventListener('focusout',event=>{if(!event.target.matches('input[type="number"]'))return;setTimeout(()=>{const row=event.target.closest('tr'),href=row?.querySelector('.open')?.getAttribute('href'),entry=entries().find(item=>item.url===href);if(entry)syncUp({...entry,metrics:{views:metricOf(entry,'views'),likes:metricOf(entry,'likes'),comments:metricOf(entry,'comments'),saves:metricOf(entry,'saves'),shares:metricOf(entry,'shares')}})},0)});
function sheetEndpoint(url){const match=String(url).match(/\/spreadsheets\/d\/([^/]+)/);if(!match)return null;const gid=(String(url).match(/[?#&]gid=(\d+)/)||[])[1]||'0';return `https://docs.google.com/spreadsheets/d/${match[1]}/gviz/tq?tqx=out:json&gid=${gid}`}
function parseSheet(text){const json=text.replace(/^.*?\{/, '{').replace(/\);?\s*$/,'');const table=JSON.parse(json).table;const cols=table.cols.map(col=>String(col.label||'').trim());return table.rows.map((row,index)=>{const values=row.c.map(cell=>cell?.v??'');const item=Object.fromEntries(cols.map((col,i)=>[col,values[i]??'']));if(index===0&&String(item.id).toLowerCase()==='id')return null;item.id=String(item.id||'sheet-'+index);item.metrics={};['views','likes','comments','saves','shares'].forEach(key=>{if(item[key]!==''&&item[key]!==null)item.metrics[key]=Number(item[key])||0;delete item[key]});return item}).filter(Boolean)}
pullShared=async()=>{const endpoint=sheetEndpoint(sharedApi);if(!endpoint)return syncStatus('请粘贴 Google Sheet 链接或共享接口地址。',true);syncStatus('正在读取共享表格…');try{const response=await fetch(endpoint,{cache:'no-store'});const text=await response.text();const remote=parseSheet(text);DATA.entries=remote;render();syncStatus('网站看板已同步 '+remote.length+' 条共享数据：'+new Date().toLocaleTimeString())}catch(error){syncStatus('读取失败：请把 Google Sheet 设置为“知道链接的用户可查看”。',true)}};
if(sharedApi)pullShared();
</script>
<script>
if(!localStorage.getItem('torras-dashboard-migrated-v2')){localStorage.removeItem('torras-dashboard-entries-v1');localStorage.removeItem('torras-dashboard-metrics-v1');localStorage.setItem('torras-dashboard-migrated-v2','1');location.reload()}
</script>
