function render(){const tabs=[['all','全部'],['ig','Instagram'],['tk','TikTok']];$('tabs').innerHTML='';tabs.forEach(([k,l])=>{const b=document.createElement('button');b.className='tab'+(state.platform===k?' on':'');b.textContent=l;b.onclick=()=>{state.platform=k;updateEntryFields();render()};$('tabs').appendChild(b)});const accounts=[...new Set(entries().map(e=>String(e.author||'').trim()).filter(Boolean))].sort();$('account-filter').innerHTML='<option value="all">全部账号</option>'+accounts.map(a=>`<option value="${a.replace(/"/g,'&quot;')}">${a}</option>`).join('');$('account-filter').value=accounts.includes(state.author)?state.author:'all';const items=list();const schema=platformMetrics(state.platform);$('metric-head-a').textContent=state.platform==='all'?'跳过率 / 平均观看时长':schema[0][1];$('metric-head-b').textContent=state.platform==='all'?'TikTok 完播率':schema[1]?.[1]||'';$('metric-head-b').hidden=state.platform==='ig';const summary=state.platform==='ig'?[['skipRate','跳过率']]:state.platform==='tk'?[['avgWatchTime','平均观看时长'],['completionRate','完播率']]:[];const labels={views:'播放',...Object.fromEntries(summary),likes:'点赞',comments:'评论',saves:'收藏',shares:'转发'};$('metrics').innerHTML='';Object.entries(labels).forEach(([k,l])=>{const vs=items.map(e=>metricOf(e,k)).filter(v=>v!==null);const total=vs.length?vs.reduce((a,b)=>a+b,0):null;const d=document.createElement('div');d.className='metric';d.innerHTML=`<div class="metric-label">${l}</div><div class="metric-value">${k==='retention3s'?fmtRetention(total===null?null:total/vs.length):fmt(total)}</div><div class="metric-hint">${vs.length?vs.length+' 条已同步':'链接数据待同步'}</div>`;$('metrics').appendChild(d)});const known=items.filter(e=>metricOf(e,'views')!==null&&metricOf(e,'likes')!==null);const rate=known.length?known.reduce((s,e)=>s+metricOf(e,'likes')/Math.max(metricOf(e,'views'),1),0)/known.length:null;$('source').textContent=`${items.length} 条链接 · ${state.platform==='all'?'IG + TK':state.platform==='ig'?'Instagram':'TikTok'}${state.a   const rows=$('rows');rows.innerHTML='';items.forEach(e=>{const tr=document.createElement('tr');const p=platformOf(e);const platformLabel=p==='tk'?'TikTok':p==='ig'?'Instagram':'其他';const rowSchema=platformMetrics(p);const vals=['views',rowSchema[0][0],rowSchema[1]?.[0]||'__none__','likes','comments','saves','shares'].map((k,i)=>{if(k==='__none__')return `<td class="metric-secondary"${state.platform==='ig'?' hidden':''}>—</td>`;const v=metricOf(e,k);const label=k==='views'?'':rowSchema.find(x=>x[0]===k)?.[1]||'';return `<td class="num ${v===null?'pending':''}" data-metric="${k}">${label?`<span class="sub">${label}</span><br>`:''}${k==='views'?fmt(v):formatMetric(k,v)}</td>`}).join('');const media=e.video_url?`<video class="cover" src="${e.video_url}" poster="${e.cover_url||''}" controls preload="metadata"></video>`:(e.cover_url||e.cover_datauri?`<img class="cover" src="${e.cover_url||e.cover_datauri}" alt="">`:'');tr.innerHTML=`<td><div class="post">${media}<div><div class="author">${e.author||'未知作者'}</div></div></div></td><td class="platform-cell"><span class="platform-badge ${p}">${platformLabel}</span></td><td class="date-cell">${e.date||e.added||'—'}</td><td class="num ${e.duration==='待读取'||!e.duration?'pending':''}">${e.duration||'待读取'}</td><td><div class="caption">${e.caption||'暂无文案'}</div></td>${vals}<td>${e.url?`<a class="open" href="${e.url}" target="_blank" rel="noopener">打开 ↗</a>`:'—'}</td>`;rows.appendChild(tr)});$('empty').hidden=items.length>0}
$('search').oninput=e=>{state.q=e.target.value.trim().toLowerCase();render()};$('account-filter').onchange=e=>{state.author=e.target.value;render()};$('rows').addEventListener('click',e=>{const link=e.target.closest('.open');if(link){e.preventDefault();prefill(entries().find(x=>x.url===link.href||x.url===link.getAttribute('href')));return}const cell=e.target.closest('td.num');if(cell){const row=cell.parentNode,key=cell.dataset.metric;if(key)editMetric(entries().find(x=>x.id===row.dataset.id),key,cell)}});document.querySelectorAll('.period').forEach(b=>b.onclick=()=>{state.period=b.dataset.period;document.querySelectorAll('.period').forEach(x=>x.classList.toggle('on',x===b));render()});$('f-date').value=new Date().toISOString().slice(0,10);$('entry-form').onsubmit=e=>{e.preventDefault();const item={id:'manual-'+Date.now(),url:$('f-url').value.trim(),author:$('f-author').value.trim(),date:$('f-date').value,added:$('f-date').value,caption:$('f-caption').value.trim(),metrics:{views:+$('f-views').value||0,skipRate:$('f-skipRate').value===''?null:+$('f-skipRate').value,avgWatchTime:$('f-avgWatchTime').value===''?null:+$('f-avgWatchTime').value,completionRate:$('f-completionRate').value===''?null:+$('f-completionRate').value,likes:+$('f-likes').value||0,comments:+$('f-comments').value||0,saves:+$('f-saves').value||0,shares:+$('f-shares').value||0}};saved.push(item);localStorage.setItem(STORE,JSON.stringify(saved));e.target.reset();$('f-date').value=new Date().toISOString().slice(0,10);render();updateEntryFields()};$('export-data').onclick=()=>{const blob=new Blob([JSON.stringify({entries:entries()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dashboard-data.json';a.click();URL.revokeObjectURL(a.href)};render();

<script>

<script>
const API_STORE='torras-dashboard-api-v1';const DEFAULT_SHEET='https://docs.google.com/spreadsheets/d/1dfZJ2Ts4k8ghemzF0SMXmUdXvQREqmRLeWBTjnLC9uU/edit#gid=1398611631';let sharedApi=localStorage.getItem(API_STORE)||new URLSearchParams(location.search).get('api')||DEFAULT_SHEET;$('api-input').value=sharedApi;
function syncStatus(message,error=false){$('sync-status').textContent=message;$('sync-status').style.color=error?'#c24b4b':'var(--muted)'}
async function syncUp(entry){if(!sharedApi)return;try{const response=await fetch(sharedApi,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'upsert',entry})});const result=await response.json();if(!result.ok)throw new Error(result.error||'接口返回失败');syncStatus('已同步到共享数据源：'+new Date().toLocaleTimeString())}catch(error){syncStatus('同步失败：'+error.message+'；本机数据仍已保存。',true)}}
async function pullShared(){if(!sharedApi)return syncStatus('请先粘贴共享接口地址。',true);syncStatus('正在读取共享数据…');try{const response=await fetch(sharedApi,{cache:'no-store'});const result=await response.json();if(!Array.isArray(result.entries))throw new Error('返回格式不正确');DATA.entries=result.entries;render();syncStatus('已读取 '+result.entries.length+' 条共享数据：'+new Date().toLocaleTimeString())}catch(error){syncStatus('读取失败：'+error.message,true)}}
$('save-api').onclick=()=>{sharedApi=$('api-input').value.trim().replace(/\/$/,'');if(sharedApi)localStorage.setItem(API_STORE,sharedApi);else localStorage.removeItem(API_STORE);syncStatus(sharedApi?'接口已保存，可点击“立即同步”。':'已清除共享接口。')};$('pull-api').onclick=pullShared;if(sharedApi)pullShared();
$('entry-form').addEventListener('submit',()=>setTimeout(()=>syncUp(saved[saved.length-1]),0));$('rows').addEventListener('focusout',event=>{if(!event.target.matches('input[type="number"]'))return;setTimeout(()=>{const row=event.target.closest('tr'),href=row?.querySelector('.open')?.getAttribute('href'),entry=entries().find(item=>item.url===href);if(entry)syncUp({...entry,metrics:{views:metricOf(entry,'views'),retention3s:metricOf(entry,'retention3s'),likes:metricOf(entry,'likes'),comments:metricOf(entry,'comments'),saves:metricOf(entry,'saves'),shares:metricOf(entry,'shares')}})},0)});
function sheetEndpoint(url){const match=String(url).match(/\/spreadsheets\/d\/([^/]+)/);if(!match)return null;const gid=(String(url).match(/[?#&]gid=(\d+)/)||[])[1]||'0';return `https://docs.google.com/spreadsheets/d/${match[1]}/gviz/tq?tqx=out:json&gid=${gid}`}
function sheetCsvEndpoint(url){const match=String(url).match(/\/spreadsheets\/d\/([^/]+)/);if(!match)return null;const gid=(String(url).match(/[?#&]gid=(\d+)/)||[])[1]||'0';return `https://docs.google.com/spreadsheets/d/${match[1]}/export?format=csv&gid=${gid}`}
function parseSheet(text){const json=text.replace(/^.*?\{/, '{').replace(/\);?\s*$/,'');const table=JSON.parse(json).table;const cols=table.cols.map(col=>String(col.label||'').trim());return table.rows.map((row,index)=>{const values=row.c.map(cell=>cell?.v??'');const item=Object.fromEntries(cols.map((col,i)=>[col,values[i]??'']));if(index===0&&String(item.id).toLowerCase()==='id')return null;item.id=String(item.id||'sheet-'+index);item.metrics={};['views','retention3s','retention_3s','3s留存率','likes','comments','saves','shares'].forEach(key=>{if(item[key]!==''&&item[key]!==null)item.metrics[key==='retention_3s'||key==='3s留存率'?'retention3s':key]=Number(item[key])||0;delete item[key]});return item}).filter(Boolean)}
function parseCsv(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const char=text[i],next=text[i+1];if(char==='"'&&quoted&&next==='"'){cell+='"';i++;continue}if(char==='"'){quoted=!quoted;continue}if(char===','&&!quoted){row.push(cell);cell='';continue}if((char==='\n'||char==='\r')&&!quoted){if(char==='\r'&&next==='\n')i++;row.push(cell);if(row.some(value=>value!==''))rows.push(row);row=[];cell='';continue}cell+=char}if(cell!==''||row.length){row.push(cell);rows.push(row)}if(!rows.length)return[];const headers=rows.shift().map(value=>value.trim());return rows.map((values,index)=>{const item=Object.fromEntries(headers.map((key,i)=>[key,values[i]??'']));item.id=String(item.id||'sheet-'+index);item.metrics={};['views','retention3s','retention_3s','3s留存率','likes','comments','saves','shares'].forEach(key=>{if(item[key]!==''&&item[key]!==null)item.metrics[key==='retention_3s'||key==='3s留存率'?'retention3s':key]=Number(item[key])||0;delete item[key]});return item})}
pullShared=async()=>{const endpoint=sheetEndpoint(sharedApi),csvEndpoint=sheetCsvEndpoint(sharedApi);if(!endpoint)return syncStatus('请粘贴 Google Sheet 链接或共享接口地址。',true);syncStatus('正在读取共享表格…');try{let response=await fetch(endpoint,{cache:'no-store'});let text=await response.text();let remote;try{remote=parseSheet(text)}catch{response=await fetch(csvEndpoint,{cache:'no-store'});remote=parseCsv(await response.text())}const remoteIds=new Set(remote.map(item=>item.id));DATA.entries=[...remote,...DATA.entries.filter(item=>!remoteIds.has(item.id))];render();syncStatus('网站看板已同步 '+remote.length+' 条共享数据，并保留 '+DATA.entries.filter(item=>!remoteIds.has(item.id)).length+' 条新录入：'+new Date().toLocaleTimeString())}catch(error){syncStatus('读取失败：请确认 Google Sheet 已设置为“知道链接的任何人可查看”。',true)}};
